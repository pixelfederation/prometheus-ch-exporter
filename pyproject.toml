[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promch"
version = "0.1.0"
description = "Kubernetes operator that exports ClickHouse query results as Prometheus metrics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "kopf>=1.37",
    # kopf handles most k8s interaction (watch + status patch via its own client),
    # but it has no public helper to read an arbitrary Secret, so k8s_secrets.py
    # does one authenticated GET via aiohttp (already transitive via kopf; declared
    # here because we import it directly). We still avoid a full k8s client library.
    # "kubernetes>=29.0",
    # "kubernetes_asyncio>=29.0",
    "aiohttp>=3.9",
    "clickhouse-connect>=0.7",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
promch = "promch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promch"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# --- Dev / CI dependencies ---
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.16.1",
    "pip-audit>=2.7",
    "types-setuptools",
]
