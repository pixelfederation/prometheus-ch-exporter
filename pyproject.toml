[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promch"
version = "0.1.0"
description = "Kubernetes operator that exports ClickHouse query results as Prometheus metrics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "kopf>=1.37",
    # kopf handles all k8s interaction (watch + status patch via its own client);
    # we import neither kubernetes nor kubernetes_asyncio directly.
    # "kubernetes>=29.0",
    # "kubernetes_asyncio>=29.0",
    "clickhouse-connect>=0.7",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
promch = "promch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promch"]

# --- Ruff (linter + formatter) ---
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# --- Dev / CI dependencies ---
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.16.2",
    "pip-audit>=2.7",
    "types-setuptools",
]
