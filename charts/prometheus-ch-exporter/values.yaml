replicaCount: 1  # HA: set to 2 (or more) AND peering.enabled=true

# High availability via kopf peering (active/standby). Requires the peering CRD
# from the prometheus-ch-exporter-crds chart. Leader runs queries + serves
# metrics; standbys freeze (empty /metrics) so there are no duplicate series.
peering:
  enabled: false
  name: "prometheus-ch-exporter"   # ClusterKopfPeering object name (isolates from other kopf operators)
  lifetime: 60                     # keep-alive TTL (s); lower => faster crash failover

# Guard against voluntary disruptions taking down all replicas at once.
podDisruptionBudget:
  enabled: false                   # enable together with HA
  minAvailable: 1

image:
  repository: ghcr.io/pixelfederation/prometheus-ch-exporter
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Optional: ClickHouseConnection resources to create alongside the operator.
# Cluster-scoped; `spec` is passed through to the CRD verbatim.
#
# Auth: TLS is on by default (secure: true, port: 8443). Credentials live in an
# auth Secret (username + password) in THIS namespace. In the spec, either:
#   (a) reference an existing Secret (recommended; keeps creds out of Helm values
#       and the Helm release object):
#         authSecretRef: { name: ch-cluster-auth }   # keys default: username, password
#   or (b) set a plaintext `password` (and optional `username`) in the spec — the
#       chart moves them into a generated Secret and wires authSecretRef; the
#       password never reaches the CRD (dev/quickstart).
#       WARNING: a chart-generated Secret is stored in the Helm release object
#       (retrievable via `helm get manifest/values`); reading it from Vault in
#       helmfile avoids plaintext-in-git but NOT the Helm-release copy.
# Example:
#   connections:
#     - name: cluster
#       spec:
#         clusterName: my_cluster
#         seedHosts: ["10.0.0.1"]
#         port: 8443
#         secure: true
#         verify: true
#         username: default
#         authSecretRef: { name: ch-cluster-auth }
#     # or chart-generated (username + password together in spec):
#     - name: dev
#       spec:
#         clusterName: dev
#         seedHosts: ["127.0.0.1"]
#         secure: false
#         port: 8123
#         username: chexporter
#         password: "devpass"   # chart creates <fullname>-dev-auth; stripped from CRD
connections: []

# User-defined ClickHouseQuery resources (data OR system). `spec` is passed
# through to the CRD verbatim. Your own data-query CRDs may instead live in
# other charts; this list is for ad-hoc / OSS use.
#   queries:
#     - name: app-errors
#       spec:
#         connectionRef: cluster
#         queryType: data
#         query: "SELECT count() AS value, app FROM ... GROUP BY app"
#         interval: "60s"
#         metric: { name: app_errors, help: "Errors per app" }
queries: []

# Built-in system monitoring queries. Their SQL and metric names live in the
# chart (templates/system-queries.yaml) and can only be toggled here, not
# overridden. queryType: system → one series per metric, per node.
systemQueries:
  enabled: true
  connectionRef: cluster
  systemMetrics: true    # system.metrics -> clickhouse_metrics{metric,clickhouse_node}
  asyncMetrics: true     # system.asynchronous_metrics -> clickhouse_asynchronous_metrics{metric,clickhouse_node}

# Operator behavior (env -> PROMCH_*). Connection details come from the
# ClickHouseConnection CRD, NOT from here.
operator:
  defaultInterval: "60s"
  defaultTimeout: "30s"
  defaultMaxConcurrent: 2
  statusInterval: "15s"
  lastErrorTtl: "10m"
  expireAfterFailures: 5
  # recheck/topology are parsed with float() in connection.py -> PLAIN SECONDS
  # (NOT duration strings; "60s" would crash the operator).
  recheckInterval: 60
  topologyInterval: 1800
  logLevel: "INFO"
  # Metric naming (global). Every metric this exporter emits is namespaced under
  # metricPrefix (a single '_' separator is added; a trailing '_' here is ignored).
  # Empty string disables prefixing. Also renames the operator's own metrics to
  # <prefix>_query_* (e.g. clickhouse_query_up).
  metricPrefix: "clickhouse"
  # Label carrying the source node on system (fan-out) queries.
  nodeLabel: "clickhouse_node"

metrics:
  port: 8080
  service:
    enabled: true
    type: ClusterIP
    annotations: {}

serviceMonitor:
  enabled: false          # requires the Prometheus Operator CRD
  interval: "30s"
  scrapeTimeout: "10s"
  honorLabels: false
  labels: {}              # e.g. release: kube-prometheus-stack

health:
  port: 8081

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
