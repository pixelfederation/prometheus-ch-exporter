{{- /*
Optional convenience: if a connection's spec sets a plaintext `password` (and does
NOT already reference an authSecretRef), generate an auth Secret (username +
password) here and let connection.yaml wire authSecretRef to it. NOTE: a
chart-generated Secret is snapshotted into the Helm release object (retrievable via
`helm get manifest`). For true isolation create the Secret out-of-band and set
spec.authSecretRef.
*/ -}}
{{- range $conn := .Values.connections }}
{{- if and (hasKey $conn.spec "password") (not (hasKey $conn.spec "authSecretRef")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s-auth" (include "prometheus-ch-exporter.fullname" $) $conn.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "prometheus-ch-exporter.labels" $ | nindent 4 }}
type: Opaque
stringData:
  username: {{ dig "username" "default" $conn.spec | quote }}
  password: {{ $conn.spec.password | quote }}
{{- end }}
{{- end }}
