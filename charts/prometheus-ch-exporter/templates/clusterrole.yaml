{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "prometheus-ch-exporter.fullname" . }}
  labels:
    {{- include "prometheus-ch-exporter.labels" . | nindent 4 }}
rules:
  # kopf scans CRDs (and namespaces, when clusterwide) to resolve what it watches.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
  - apiGroups: [prometheus-ch-exporter.io]
    resources: [clickhouseconnections, clickhousequeries]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [prometheus-ch-exporter.io]
    resources: [clickhouseconnections/status, clickhousequeries/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  {{- if .Values.peering.enabled }}
  # kopf peering for HA leader election (active/standby). The ClusterKopfPeering
  # object is shipped by the chart (kopf does NOT auto-create it); kopf only
  # needs to patch it for the keep-alive, plus get/list/watch to read peers.
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings]
    verbs: [get, list, watch, patch]
  {{- end }}
{{- end }}
