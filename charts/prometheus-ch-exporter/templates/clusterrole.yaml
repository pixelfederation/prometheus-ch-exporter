{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "prometheus-ch-exporter.fullname" . }}
  labels:
    {{- include "prometheus-ch-exporter.labels" . | nindent 4 }}
rules:
  # kopf scans CRDs (and namespaces, when clusterwide) to resolve what it watches.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
  - apiGroups: [prometheus-ch-exporter.io]
    resources: [clickhouseconnections, clickhousequeries]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [prometheus-ch-exporter.io]
    resources: [clickhouseconnections/status, clickhousequeries/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
{{- end }}
