{{- if .Values.systemQueries.enabled }}
{{- $conn := .Values.systemQueries.connectionRef }}
{{- /*
  Built-in system monitoring queries. Definitions (SQL + metric name) live here
  in the chart and are NOT overridable via values — users only toggle them with
  the per-query booleans under .Values.systemQueries. queryType: system fans out
  to every node, adding a `node` label.
*/ -}}
{{- $builtins := list
    (dict "key" "systemMetrics" "name" "ch-system-metrics"
      "metricName" "clickhouse_metrics"
      "help" "ClickHouse system.metrics values (one series per metric, per node)"
      "query" "SELECT value AS value, metric FROM system.metrics")
    (dict "key" "asyncMetrics" "name" "ch-asynchronous-metrics"
      "metricName" "clickhouse_asynchronous_metrics"
      "help" "ClickHouse system.asynchronous_metrics values (one series per metric, per node)"
      "query" "SELECT value AS value, metric FROM system.asynchronous_metrics")
}}
{{- range $builtins }}
{{- if index $.Values.systemQueries .key }}
---
apiVersion: prometheus-ch-exporter.io/v1alpha1
kind: ClickHouseQuery
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "prometheus-ch-exporter.labels" $ | nindent 4 }}
spec:
  connectionRef: {{ $conn }}
  queryType: system
  query: {{ .query | quote }}
  metric:
    name: {{ .metricName }}
    help: {{ .help | quote }}
{{- end }}
{{- end }}
{{- end }}
