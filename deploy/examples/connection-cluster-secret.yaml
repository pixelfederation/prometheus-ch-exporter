# The auth Secret must live in the operator's namespace. In production, prefer
# creating this via External Secrets Operator / Vault Agent so the credentials
# never pass through Helm values or the Helm release object.
apiVersion: v1
kind: Secret
metadata:
  name: ch-cluster-auth
  namespace: prometheus-ch-exporter   # operator's namespace
type: Opaque
stringData:
  username: "chexporter"   # optional; falls back to spec.username if omitted
  password: "CHANGE_ME"
