name: docker-publish

on:
  push:
    tags:
      - "v*"        # app release: build+push image AND publish the chart
      - "chart-*"   # chart-only release: publish the chart, no image build
      - "crds-*"    # CRD-chart-only release: publish the CRDs chart
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Image is built only for app releases (v* tags), not chart-only releases.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create GitHub Releases on tags
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signing via OIDC
      attestations: write  # provenance/SBOM attestations
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 is required; arm64 is best-effort (slower via QEMU) — drop it
          # here if builds are too slow.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations pushed alongside the image.
          provenance: true   # SLSA build provenance
          sbom: true         # SBOM (SPDX)

      - name: Sign the image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  chart-release:
    # Runs for both v* (app+chart) and chart-* (chart only). Independent of the
    # image build — the chart is packaged from Chart.yaml (version + appVersion),
    # so a chart-only bump publishes without rebuilding the app image. Excludes
    # crds-* (handled by crd-chart-release).
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/chart-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push the chart to GHCR (OCI)
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package Helm chart
        run: helm package charts/prometheus-ch-exporter --destination ./dist

      - name: Log in to GHCR (Helm OCI)
        run: |
          helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Push chart to GHCR (OCI)
        run: |
          helm push dist/*.tgz "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tgz

  crd-chart-release:
    # CRD chart has an independent lifecycle; released via crds-* tags.
    if: startsWith(github.ref, 'refs/tags/crds-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push the chart to GHCR (OCI)
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package Helm chart
        run: helm package charts/prometheus-ch-exporter-crds --destination ./dist

      - name: Log in to GHCR (Helm OCI)
        run: |
          helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Push chart to GHCR (OCI)
        run: |
          helm push dist/*.tgz "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tgz
