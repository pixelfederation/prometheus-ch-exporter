name: docker-publish

on:
  push:
    tags:
      - "v*"        # full release: build+push image AND publish both charts
      - "chart-*"   # charts-only release: publish both charts (1:1), no image build
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Image is built only for app releases (v* tags), not chart-only releases.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create GitHub Releases on tags
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signing via OIDC
      attestations: write  # provenance/SBOM attestations
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 is required; arm64 is best-effort (slower via QEMU) — drop it
          # here if builds are too slow.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations pushed alongside the image.
          provenance: true   # SLSA build provenance
          sbom: true         # SBOM (SPDX)

      - name: Sign the image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  charts-release:
    # Both charts (app + CRDs) are versioned in lockstep and released together.
    # Runs for v* (full release, alongside the image) and chart-* (charts only,
    # no image). Charts are packaged from each Chart.yaml (version + appVersion),
    # so a charts-only bump publishes without rebuilding the app image. This is
    # the ONLY job that creates the GitHub Release for the tag (build-and-push
    # does not), so there is no race on the release object.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/chart-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push the charts to GHCR (OCI)
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package Helm charts
        run: |
          helm package charts/prometheus-ch-exporter --destination ./dist
          helm package charts/prometheus-ch-exporter-crds --destination ./dist

      - name: Log in to GHCR (Helm OCI)
        run: |
          helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      - name: Push charts to GHCR (OCI)
        run: |
          for chart in dist/*.tgz; do
            helm push "$chart" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tgz
